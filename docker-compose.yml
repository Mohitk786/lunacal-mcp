# Dedicated Postgres for lunacal-mcp. The database port is not published:
# published Docker ports bypass UFW. The MCP container reaches Postgres on the compose network.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: lunacal_mcp
    volumes:
      - mcp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d lunacal_mcp"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mcp

  mcp:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://mcp:${POSTGRES_PASSWORD}@postgres:5432/lunacal_mcp
      TRUST_PROXY: "true"
      PORT: "3939"
    ports:
      - "3939:3939"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mcp
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3939/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  mcp:

volumes:
  mcp_postgres_data:
